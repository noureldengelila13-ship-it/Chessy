{id:'italian',cat:'open',en:'Italian Game',ar:'الافتتاحية الإيطالية',side:'w',kw:'جيوكو بيانو bc4 e4 e5',line:'e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4',desc:'افتتاحية كلاسيكية سهلة وسريعة: بتطلّع الفيل لـ c4 وبتستهدف f7، وبتجهّز لتحكّم في المركز.',ideas:['طلّع الفيل لـ c4 على القطر المستهدف f7','c3 وبعدها d4 عشان تاخد المركز','بيّض بسرعة واحمي ملكك'],descEn:"A classic, easy opening: develop the bishop to c4, aim at f7, and prepare to fight for the center.",ideasEn:["Bishop to c4 on the diagonal toward f7", "c3 then d4 to take the center", "Castle early and keep your king safe"]},
{id:'evans',cat:'gambit',en:'Evans Gambit',ar:'جامبيت إيفانز',side:'w',kw:'gambit b4 ضحية بيدق هجوم',line:'e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4',desc:'بتضحّي ببيدق b4 عشان تاخد المركز وتفتح خطوط للهجوم. جامبيت هجومي مشهور.',ideas:['ضحّي بـ b4 عشان تكسب وقت','c3 وd4 تبني مركز قوي','الهجوم السريع على f7 والملك'],descEn:"Sacrifice the b4 pawn to seize the center and open attacking lines. A famous attacking gambit.",ideasEn:["b4 sacrifices a pawn for time", "c3 and d4 build a strong center", "Fast attack on f7 and the king"]},
{id:'ruy',cat:'open',en:'Ruy Lopez (Spanish)',ar:'روي لوبيز (الإسبانية)',side:'w',kw:'bb5 spanish اسبانية',line:'e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7',desc:'من أقدم وأقوى الافتتاحيات. الفيل بيضغط على الحصان اللي بيحمي e5. لعب استراتيجي عميق.',ideas:['الضغط غير المباشر على e5','بيّض بدري','خطة طويلة المدى في المنتصف'],descEn:"One of the oldest and strongest openings. The bishop pressures the knight that defends e5. Deep strategic play.",ideasEn:["Indirect pressure on e5", "Castle early", "Long-term middlegame plans"]},
{id:'scotch',cat:'open',en:'Scotch Game',ar:'الافتتاحية الإسكتلندية',side:'w',kw:'d4 اسكتلندية',line:'e4 e5 Nf3 Nc6 d4 exd4 Nxd4 Nf6 Nxc6 bxc6 e5',desc:'بتفتح المركز مبكراً بـ d4. لعب مفتوح ونشيط وسهل الفهم.',ideas:['افتح المركز مبكراً','نشّط قطعك بسرعة','البيدق e5 بيطرد الحصان'],descEn:"Opens the center early with d4. Open, active play that is easy to understand.",ideasEn:["Open the center early", "Activate your pieces fast", "The e5 pawn kicks the knight"]},
{id:'kg',cat:'gambit',en:"King's Gambit",ar:'جامبيت الملك',side:'w',kw:'f4 gambit رومانسي',line:'e4 e5 f4 exf4 Nf3 g5 h4 g4 Ne5',desc:'أكتر جامبيت رومانسي وهجومي. بتضحّي ببيدق f عشان تفتح خط f وتهاجم.',ideas:['ضحية بيدق f4','خط f المفتوح للهجوم','خطر على ملكك كمان، فخلّي بالك'],descEn:"The most romantic, attacking gambit. Sacrifice the f-pawn to open the f-file and attack.",ideasEn:["The f4 pawn sacrifice", "Open f-file for the attack", "Your own king is at risk too, so be careful"]},
{id:'danish',cat:'gambit',en:'Danish Gambit',ar:'الجامبيت الدنماركي',side:'w',kw:'d4 c3 تضحية بيدقين',line:'e4 e5 d4 exd4 c3 dxc3 Bc4 cxb2 Bxb2',desc:'بتضحّي ببيدقين عشان تطلّع الفيلين على أقطار قوية صوب ملك الأسود. هجوم سريع جداً.',ideas:['بيدقين مقابل تطوير سريع','الفيلين بيستهدفوا f7 وg7','لازم تهاجم بسرعة'],descEn:"Sacrifice two pawns to put both bishops on powerful diagonals toward the black king. A very fast attack.",ideasEn:["Two pawns for rapid development", "Bishops aim at f7 and g7", "You must attack quickly"]},
{id:'najdorf',cat:'open',en:'Sicilian: Najdorf',ar:'الدفاع الصقلي: نايدورف',side:'b',kw:'sicilian c5 a6 صقلي',line:'e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6',desc:'من أشهر الدفاعات وأكتر واحد بيحارب للفوز بالأسود. a6 بتمنع الحصان والفيل من b5.',ideas:['اكسب مساحة على جناح الوزير','عدم توازن = فرص فوز للأسود','لعب محتاج حفظ شوية'],descEn:"The most famous defense, and the one that fights hardest for a win with Black. a6 stops bishop and knight from b5.",ideasEn:["Gain space on the queenside", "Imbalance = winning chances for Black", "Needs some memorization"]},
{id:'morra',cat:'gambit',en:'Smith-Morra Gambit',ar:'جامبيت سميث-مورا',side:'w',kw:'sicilian c3 d4 ضد الصقلي',line:'e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 d6 Bc4',desc:'سلاح للأبيض ضد الصقلي: ضحّي ببيدق عشان تطوّر بسرعة وتضغط على الخطوط المفتوحة.',ideas:['ضحية بيدق مقابل تطوير','قطع نشيطة وضغط على d وc','الأسود لازم يدافع بدقة'],descEn:"A weapon for White against the Sicilian: give a pawn for fast development and pressure on open lines.",ideasEn:["Pawn sacrifice for development", "Active pieces, pressure on the c- and d-files", "Black must defend precisely"]},
{id:'french',cat:'open',en:'French Defense',ar:'الدفاع الفرنسي',side:'b',kw:'e6 d5 فرنسي',line:'e4 e6 d4 d5 Nc3 Bb4 e5 c5 a3 Bxc3+ bxc3',desc:'دفاع صلب ومتين: بيدقك d5 بيواجه المركز وبعدين بتضرب بـ c5.',ideas:['e6 وd5 بناء قوي','اضرب المركز بـ c5','الفيل الأبيض الضعيف خلف السلسلة'],descEn:"A solid, tough defense: your d5 pawn challenges the center, then you strike with c5.",ideasEn:["e6 and d5: a strong structure", "Hit the center with c5", "White's bad bishop behind the chain"]},
{id:'caro',cat:'open',en:'Caro-Kann',ar:'دفاع كارو-كان',side:'b',kw:'c6 d5 اقفل',line:'e4 c6 d4 d5 Nc3 dxe4 Nxe4 Bf5 Ng3 Bg6',desc:'دفاع آمن جداً. بتطلّع الفيل برّه سلسلة البيادق قبل ما تقفلها بـ e6.',ideas:['c6 تدعم d5','طلّع الفيل لـ f5 بدري','هيكل بيادق سليم'],descEn:"A very safe defense. Develop the bishop outside the pawn chain before locking it with e6.",ideasEn:["c6 supports d5", "Get the bishop to f5 early", "A healthy pawn structure"]},
{id:'scand',cat:'open',en:'Scandinavian',ar:'الدفاع الاسكندنافي',side:'b',kw:'d5 qxd5 الملكة',line:'e4 d5 exd5 Qxd5 Nc3 Qa5 d4 Nf6',desc:'بتهاجم e4 فوراً بـ d5. الوزير بيطلع بدري، بس بسيط ومباشر.',ideas:['d5 فوراً ضد e4','Qa5 يهرب من الحصان','كمّل التطوير بسرعة'],descEn:"Attack e4 immediately with d5. The queen comes out early, but it is simple and direct.",ideasEn:["d5 immediately against e4", "Qa5 escapes the knight", "Keep developing fast"]},
{id:'pirc',cat:'open',en:'Pirc Defense',ar:'دفاع بيرتس',side:'b',kw:'d6 g6 فيانكيتو',line:'e4 d6 d4 Nf6 Nc3 g6 f4 Bg7 Nf3',desc:'بتسيب الأبيض يبني المركز وبعدين تضرب عليه من الأجناب بالفيل g7.',ideas:['فيل g7 قوي','سيب المركز وهاجمه بعدين','مرونة كبيرة'],descEn:"Let White build a center, then strike at it from the flanks with the g7 bishop.",ideasEn:["Strong g7 bishop", "Give up the center, attack it later", "Very flexible"]},
{id:'qg',cat:'open',en:"Queen's Gambit",ar:'جامبيت الوزير',side:'w',kw:'d4 c4 d5',line:'d4 d5 c4 e6 Nc3 Nf6 Bg5 Be7 e3 O-O',desc:'أشهر افتتاحية بـ d4. مش جامبيت حقيقي لأن الأبيض يقدر يستعيد البيدق. مركز قوي وخطط واضحة.',ideas:['c4 بيضغط على d5','تطوير هادئ','هيكل مركز متين'],descEn:"The most famous d4 opening. Not a real gambit, since White can win the pawn back. Strong center, clear plans.",ideasEn:["c4 pressures d5", "Calm development", "A solid central structure"]},
{id:'qga',cat:'gambit',en:"Queen's Gambit Accepted",ar:'جامبيت الوزير المقبول',side:'b',kw:'dxc4',line:'d4 d5 c4 dxc4 Nf3 Nf6 e3 e6 Bxc4 c5',desc:'الأسود بياخد بيدق c4 ويرجّعه بعدين عشان يلعب c5 ويتعادل بسهولة.',ideas:['خد البيدق وارجّع','c5 يضرب المركز','نشاط للفيل'],descEn:"Black takes the c4 pawn and gives it back later to play c5 and equalize easily.",ideasEn:["Take the pawn and return it", "c5 strikes the center", "Activity for the bishop"]},
{id:'slav',cat:'open',en:'Slav Defense',ar:'الدفاع السلافي',side:'b',kw:'c6 d5',line:'d4 d5 c4 c6 Nf3 Nf6 Nc3 dxc4 a4 Bf5',desc:'دفاع متين ضد جامبيت الوزير: c6 تدعم d5 وتسيب الفيل يطلع بره.',ideas:['c6 قوية','فيل c8 حر','هيكل سليم'],descEn:"A tough defense to the Queen's Gambit: c6 supports d5 and lets the bishop out.",ideasEn:["Strong c6", "Free c8 bishop", "Healthy structure"]},
{id:'kid',cat:'open',en:"King's Indian",ar:'الدفاع الهندي الملكي',side:'b',kw:'g6 bg7',line:'d4 Nf6 c4 g6 Nc3 Bg7 e4 d6 Nf3 O-O',desc:'بتسيب الأبيض يبني مركز كبير وتهاجمه بعدين، وغالباً بتهاجم ملك الأبيض بـ f5.',ideas:['فيل g7 على القطر الطويل','بيّض بدري','هجوم على الجناح الملكي'],descEn:"Let White build a big center, then attack it, often with a kingside pawn storm starting with f5.",ideasEn:["The g7 bishop on the long diagonal", "Castle early", "Kingside attack"]},
{id:'nimzo',cat:'open',en:'Nimzo-Indian',ar:'الدفاع النمزو-هندي',side:'b',kw:'bb4 e6',line:'d4 Nf6 c4 e6 Nc3 Bb4 e3 O-O Bd3 d5',desc:'الفيل b4 بيدبّس الحصان c3 وبيتحكم في e4. دفاع مرن ومحترم.',ideas:['اربط الحصان c3','تحكم في e4','ممكن تضعّف بيادق الأبيض'],descEn:"The b4 bishop pins the c3 knight and fights for e4. A flexible, respected defense.",ideasEn:["Pin the c3 knight", "Control e4", "You can double White's pawns"]},
{id:'london',cat:'open',en:'London System',ar:'نظام لندن',side:'w',kw:'bf4 d4 سهل',line:'d4 d5 Bf4 Nf6 e3 e6 Nf3 Bd6 Bg3 O-O',desc:'سيستم سهل الحفظ: بتلعب نفس الحركات تقريباً ضد أغلب الدفاعات. ممتاز للمبتدئين.',ideas:['d4 + Bf4 + e3','Nf3 وBd3 وO-O','خطة ثابتة'],descEn:"An easy system to learn: you play almost the same moves against most defenses. Great for beginners.",ideasEn:["d4 + Bf4 + e3", "Nf3, Bd3, O-O", "A fixed plan"]},
{id:'english',cat:'open',en:'English Opening',ar:'الافتتاحية الإنجليزية',side:'w',kw:'c4',line:'c4 e5 Nc3 Nf6 Nf3 Nc6 g3 d5 cxd5 Nxd5',desc:'افتتاحية مرنة بتبدأ بـ c4 وبتسيطر على d5 من الجنب.',ideas:['اتحكم في d5','فيانكيتو g3 + Bg2','لعب إستراتيجي مرن'],descEn:"A flexible opening starting with c4, controlling d5 from the flank.",ideasEn:["Control d5", "Fianchetto with g3 and Bg2", "Flexible strategic play"]},
{id:'englund',cat:'trap',en:'Englund Gambit (trap)',ar:'جامبيت إنجلند (فخ)',side:'b',kw:'d4 e5 فخ',line:'d4 e5 dxe5 Nc6 Nf3 Qe7 Bf4 Qb4+ Bd2 Qxb2 Bc3 Bb4 Qd2 Bxc3 Qxc3 Qxa1+',desc:'جامبيت مخادع: لو الأبيض أخد البيدق ولعب بسرعة ممكن يقع في فخ ويخسر الطابية! لكن لو لعب صح الأسود في ورطة.',ideas:['الفخ: Bf4 Qb4+ وبعدها Qxb2','لو لعب الأبيض بدقة هو الأفضل','للتسلية والمفاجآت فقط'],descEn:"A tricky gambit: if White grabs the pawn and plays fast, they can fall into a trap and lose a rook! But accurate play leaves Black in trouble.",ideasEn:["The trap: Bf4 Qb4+ then Qxb2", "Accurate play favors White", "For fun and surprises only"]},
{id:'budapest',cat:'gambit',en:'Budapest Gambit',ar:'جامبيت بودابست',side:'b',kw:'e5 ng4',line:'d4 Nf6 c4 e5 dxe5 Ng4 Bf4 Nc6 Nf3 Bb4+',desc:'الأسود بيضحّي ببيدق e5 ويطلّع الحصان لـ g4 ويهاجم بسرعة.',ideas:['e5 جريئة','Ng4 بيهدد e5','تطوير سريع'],descEn:"Black sacrifices the e5 pawn, jumps the knight to g4 and attacks quickly.",ideasEn:["Bold e5", "Ng4 targets e5", "Fast development"]},
{id:'benko',cat:'gambit',en:'Benko Gambit',ar:'جامبيت بينكو',side:'b',kw:'b5 c5',line:'d4 Nf6 c4 c5 d5 b5 cxb5 a6 bxa6 Bxa6 Nc3 d6',desc:'ضحّي ببيدق b5 عشان تفتح خطوط a وb للطوابي وتضغط على جناح الوزير.',ideas:['ضحية بيدق دائمة','الطوابي على الأعمدة المفتوحة','ضغط طويل الأمد'],descEn:"Sacrifice the b5 pawn to open the a- and b-files for your rooks and squeeze the queenside.",ideasEn:["A long-term pawn sacrifice", "Rooks on the open files", "Lasting pressure"]},
{id:'fried',cat:'trap',en:'Fried Liver Attack',ar:'هجوم الكبد المقلي',side:'w',kw:'ng5 nxf7 هجوم',line:'e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nxd5 Nxf7 Kxf7 Qf3+ Ke6 Nc3',desc:'هجوم قوي ضد Nf6: بتضحّي بالحصان على f7 وتجرّ الملك للوسط. محفوف بالمخاطر لو لعب الأسود دقيق.',ideas:['Ng5 تهاجم f7','Nxf7 ضحية الحصان','الملك الأسود مكشوف'],descEn:"A fierce attack on Nf6: sacrifice the knight on f7 and drag the king into the open. Risky if Black defends well.",ideasEn:["Ng5 attacks f7", "Nxf7: the knight sacrifice", "The black king is exposed"]},
{id:'vienna',cat:'gambit',en:'Vienna Gambit',ar:'جامبيت فيينا',side:'w',kw:'nc3 f4',line:'e4 e5 Nc3 Nf6 f4 d5 fxe5 Nxe4 Nf3 Be7',desc:'زي جامبيت الملك بس بحصان c3 يحمي ويضغط على المركز.',ideas:['f4 بعد Nc3','هجوم على المركز','أمان أكتر من جامبيت الملك'],descEn:"Like the King's Gambit, but the c3 knight adds protection and central pressure.",ideasEn:["f4 after Nc3", "Attack the center", "Safer than the King's Gambit"]},
{id:'legal',cat:'trap',en:"Légal's Mate",ar:'مات ليجال (فخ)',side:'w',kw:'trap فخ ملكة',line:'e4 e5 Nf3 d6 Bc4 Bg4 Nc3 g6 Nxe5 Bxd1 Bxf7+ Ke7 Nd5#',desc:'فخ قديم وجميل: بتضحّي بالوزير عشان تعمل مات بقطع صغيرة. اتحذر لما تلعب Bg4 بدري.',ideas:['ضحّي بالوزير Nxe5','Bxf7+ الشاه بيتجر','Nd5# مات بالحصان'],descEn:"A beautiful old trap: sacrifice your queen to mate with minor pieces. Watch out when playing Bg4 early.",ideasEn:["Sacrifice the queen with Nxe5", "Bxf7+ drags the king", "Nd5#: mate by knight"]},
{id:'scholar',cat:'trap',en:"Scholar's Mate",ar:'مات المدرسة (٤ نقلات)',side:'w',kw:'qh5 qxf7 مات سريع',line:'e4 e5 Bc4 Nc6 Qh5 Nf6 Qxf7#',desc:'أشهر مات سريع. الدفاع: بدري افتح حصان f6 واحمي f7 ولا تتسرع.',ideas:['الوزير والفيل على f7','احمي f7 بـ Nf6 أو g6','متتعبش نفسك لو اتلعبت ضدك: Nf6 تنهيه'],descEn:"The most famous quick mate. The defense: develop the f6 knight early, guard f7, and don't rush.",ideasEn:["Queen and bishop on f7", "Defend f7 with Nf6 or g6", "If it is tried on you: Nf6 ends it"]},
{id:'fool',cat:'trap',en:"Fool's Mate",ar:'مات الأحمق (نقلتين)',side:'b',kw:'أسرع مات f3 g4',line:'f3 e5 g4 Qh4#',desc:'أسرع مات ممكن في الشطرنج: بس الأبيض لازم يلعب أسوأ نقلات!',ideas:['f3 وg4 بتفتح القطر للملك','Qh4#','خلّي بالك من ملكك'],descEn:"The fastest mate possible in chess: White just has to play the worst moves!",ideasEn:["f3 and g4 open the king's diagonal", "Qh4#", "Take care of your own king"]},
{id:'fork',cat:'tact',en:'Fork',ar:'الشوكة (Fork)',side:'w',kw:'fork حصان',fen:'2q3k1/5ppp/8/3N4/8/8/8/4K3 w - - 0 1',desc:'قطعة واحدة بتهاجم قطعتين أو أكتر في نفس الوقت، والخصم مش هيقدر ينقذهم كلهم. الحصان أخطر قطعة في الشوكات.',ideas:['حصان + ملك + وزير = شوكة ملكية','كل ما القطع الأغلى كل ما أحلى','دور على مربعات الحصان اللي بتهاجم قطعتين'],descEn:"One piece attacks two or more at once, and the opponent cannot save them all. The knight is the deadliest forker.",ideasEn:["Knight + king + queen = royal fork", "The pricier the targets, the sweeter", "Look for knight squares that hit two pieces"]},
{id:'pin',cat:'tact',en:'Pin',ar:'التثبيت (Pin)',side:'w',kw:'pin',fen:'4k3/8/2n5/1B6/8/8/8/4K3 b - - 0 1',desc:'قطعة بتتثبت لأنها لو اتحركت هتكشف قطعة أغلى وراها (غالباً الملك). التثبيت المطلق: القطعة مينفعش تتحرك.',ideas:['فيل أو طابية أو وزير بيثبتوا','هاجم القطعة المثبتة بحاجة تانية','Bb5 يثبت الحصان c6 قدام الملك e8'],descEn:"A piece is pinned because moving it would expose a more valuable piece behind it (often the king). An absolute pin means it cannot legally move.",ideasEn:["Bishops, rooks and queens pin", "Attack the pinned piece again", "Bb5 pins the c6 knight to the king on e8"]},
{id:'skewer',cat:'tact',en:'Skewer',ar:'السيخ (Skewer)',side:'w',kw:'skewer',fen:'3k3q/8/8/8/8/8/8/R3K3 w - - 0 1',desc:'عكس التثبيت: بتهاجم القطعة الأغلى أولاً، لما تتحرك تاخد اللي وراها.',ideas:['كش بالطابية Ra8+','الملك لازم يتحرك','Rxh8 ياخد الوزير'],descEn:"The reverse of a pin: attack the more valuable piece first, and when it moves you take what is behind.",ideasEn:["Check with the rook: Ra8+", "The king must move", "Rxh8 wins the queen"]},
{id:'disc',cat:'tact',en:'Discovered Attack',ar:'الهجوم المكشوف',side:'w',kw:'discovered',desc:'بتحرك قطعة فبتكشف هجوم قطعة تانية وراها. لو الحركة نفسها كش أو بتهدد قطعة، بيبقى مضاعف.',ideas:['حرّك القطعة الأمامية بتهديد','القطعة الخلفية بتهاجم','هجوم مزدوج = صعب الدفاع'],descEn:"Move one piece and unveil an attack from a piece behind it. If the move itself gives check or a threat, it is double.",ideasEn:["Move the front piece with a threat", "The back piece attacks", "A double attack is hard to defend"]},
{id:'backrank',cat:'tact',en:'Back-rank mate',ar:'مات الصف الأخير',side:'w',kw:'back rank',fen:'6k1/5ppp/8/8/8/8/8/R3K3 w - - 0 1',desc:'الملك محبوس خلف بيادقه نفسها وطابية أو وزير بيدخل الصف الأخير. دايماً اعمل "نافذة" لملكك بـ h3 أو g3.',ideas:['اعمل فتحة لملكك','حافظ على طابية تحمي الصف الأخير','دور على الفرصة عند الخصم'],descEn:"The king is trapped behind its own pawns and a rook or queen slips into the last rank. Always make luft for your king with h3 or g3.",ideasEn:["Make an escape square for your king", "Keep a rook guarding the back rank", "Look for the same chance against your opponent"]},
{id:'zug',cat:'str',en:'Zugzwang',ar:'الزوجزوانج',side:'w',kw:'zugzwang',desc:'لما اللي عليه الدور بيبقى أي نقلة يلعبها تضره، ومفيش نقلة "ماسك". شائعة في النهايات.',ideas:['"لو كان ليّ أن أمرّر دوري"','الملك والبيادق بس','معرفة المعارضة تساعد'],descEn:"When the side to move hurts itself with every legal move and has no pass. Common in endgames.",ideasEn:["\"If only I could skip my turn\"", "Just king and pawns", "Knowing the opposition helps"]},
{id:'opp',cat:'end',en:'Opposition',ar:'المعارضة (Opposition)',side:'w',kw:'opposition ملك بيدق',fen:'8/8/8/4k3/8/4K3/4P3/8 w - - 0 1',desc:'مفتاح نهايات الملك والبيدق: لما الملكين يواجهوا بعض بمربع واحد بينهم، اللي ماعليهش الدور بياخد المعارضة.',ideas:['تقدّم الملك قدام البيدق','خد المعارضة','البيدق يتقدم لما الملك يسانده'],descEn:"The key to king-and-pawn endings: when the kings face each other one square apart, the side NOT to move has the opposition.",ideasEn:["Advance the king in front of the pawn", "Take the opposition", "The pawn advances when its king supports it"]},
{id:'passed',cat:'str',en:'Passed pawn',ar:'البيدق الحر',side:'w',kw:'passed pawn',desc:'بيدق مفيش قدامه ولا على جنبه بيدق للخصم يمنعه. في النهايات ده ذهب.',ideas:['ادفعه لما يبقى مدعوم','ملك قريب = أقوى','الطابية خلفه'],descEn:"A pawn with no enemy pawn ahead of it or beside it. In the endgame it is gold.",ideasEn:["Push it when it is supported", "A nearby king makes it stronger", "Put a rook behind it"]},
{id:'bpair',cat:'str',en:'Bishop pair',ar:'زوج الفيلة',side:'w',kw:'bishops',desc:'الفيلان مع بعض قويين في المراكز المفتوحة لأنهم بيغطوا كل ألوان المربعات.',ideas:['افتح اللعب','اتبادل الحصان مقابل الفيل بحذر','اتجنب البيادق المقفولة'],descEn:"Two bishops together are strong in open positions because they cover squares of both colors.",ideasEn:["Open the game", "Trade knight for bishop with care", "Avoid locked pawn chains"]},
{id:'isolated',cat:'str',en:'Isolated pawn',ar:'البيدق المعزول',side:'w',kw:'isolated',desc:'بيدق مفيش جنبه بيدق من نفس اللون على الأعمدة المجاورة. قوة نشاط لكن ضعف كمان.',ideas:['ضغط وقطع نشيطة تعوّض','في النهاية بيبقى هدف','بدّل القطع لو ضعفه ظاهر'],descEn:"A pawn with no friendly pawn on a neighboring file. It gives activity but is also a weakness.",ideasEn:["Active pieces compensate", "It becomes a target in the endgame", "Trade pieces if it is weak"]},
{id:'lucena',cat:'end',en:'Lucena position',ar:'وضع لوسينا',side:'w',kw:'lucena rook endgame',fen:'1K1k4/1P6/8/8/8/8/r7/2R5 w - - 0 1',desc:'أشهر نهاية طابية وبيدق فيها فوز: الأسود ملكه محبوس والأبيض بيبني "جسر" عشان يرقّي.',ideas:['الطابية تعمل جسر على الصف الرابع','الملك يختبئ ورا الجسر','تحتاج تمرين على الفكرة'],descEn:"The most famous winning rook-and-pawn ending: the enemy king is cut off and White builds a \"bridge\" to promote.",ideasEn:["The rook builds a bridge on the fourth rank", "The king hides behind the bridge", "The idea takes practice"]}

    if(o.targets&&o.targets.indexOf(sq)>=0)cls+=p!=='.'?' tcap':' tgt';

    if(o.broken===sq&&!o.brokenFin)h+=crackHTML();

      var fx=(o.flip?7-(f&7):(f&7))+.5,fy=(o.flip?7-(f>>3):(f>>3))+.5,tx=(o.flip?7-(t2&7):(t2&7))+.5,ty=(o.flip?7-(t2>>3):(t2>>3))+.5;
      var dx=tx-fx,dy=ty-fy,len=Math.sqrt(dx*dx+dy*dy),ux=dx/len,uy=dy/len;
      var ex=tx-ux*.28,ey=ty-uy*.28,px=-uy,py=ux;

    });

function animateLast(flip){

    var sq=bd.querySelector('[data-sq="'+mv[1]+'"]');if(!sq)return;

  var D=EN.drill,a=EN.e.line.split(' ');
  if(D.i>=a.length){D.done=true;D.msg='<div class="fb good">'+t('drillDone')+'</div>';drillView();return;}
  if(D.s.t!==drillSide()){setTimeout(function(){if(EN.drill!==D)return;var m=parseSAN(D.s,a[D.i]);D.s=make(D.s,m);D.last=[m.f,m.t];D.i++;ANIM=[m.f,m.t];drillView();drillAuto();},550);}
}
function drillView(){
  var E=EN,D=E.drill,a=E.e.line.split(' ');
  var nm=UI.lang==='en'?E.e.en:E.e.ar;
  var h=topbar(t('drillT')+nm,'go(entryView)')+boardHTML({s:D.s,flip:drillSide()==='b',sel:D.sel,targets:D.sel!=null?legalTargets(D.s,D.sel):[],last:D.last,arrows:D.hint?[[D.hint.f,D.hint.t,'#3498db']]:[]});
  h+='<div id="fb">'+D.msg+'</div><p class="dim center">'+t('moveN')+' '+Math.min(Math.ceil((D.i+1)/2),Math.ceil(a.length/2))+' '+t('moveOf')+' '+Math.ceil(a.length/2)+'</p>';
  if(D.done)h+='<button class="big" onclick="playFromEntry2()">'+t('playFromHere')+'</button><button class="big sec2" onclick="startDrill()">'+t('retrain')+'</button>';
  else h+='<div class="ctl"><button onclick="dhint()">'+t('hintL')+'</button></div>';
  setApp(h);onSq=dtap;
  animateLast(drillSide()==='b');
}
function playFromEntry2(){var D=EN.drill,c=store.get('cfg',{lvl:2});newGame({mode:'cpu',human:drillSide(),lvl:c.lvl,mins:0,startFen:toFEN(D.s)});}
function dhint(){var D=EN.drill,a=EN.e.line.split(' ');if(D.done||D.s.t!==drillSide())return;D.hint=parseSAN(D.s,a[D.i]);drillView();}
function dtap(sq){
  var D=EN.drill;if(D.done||D.s.t!==drillSide())return;
  var s=D.s,legal=genMoves(s);
  if(D.sel!=null){var c=legal.filter(function(m){return m.f===D.sel&&m.t===sq;});
    if(c.length){if(c[0].pr)askPromo(c,s.t==='w',function(x){dcheck(x);});else dcheck(c[0]);return;}}
  var p=s.b[sq];D.sel=(p!=='.'&&isW(p)===(s.t==='w')&&sq!==D.sel)?sq:null;drillView();
}
function dcheck(m){
  var D=EN.drill,a=EN.e.line.split(' '),s=D.s,sn=san(s,m,genMoves(s));D.sel=null;
  if(cleanSan(sn)!==cleanSan(a[D.i])){D.wrong++;D.msg='<div class="fb bad">'+t('notLine')+(D.wrong>=2?t('expected')+'<b dir="ltr">'+a[D.i]+'</b>':t('tryAgain'))+'</div>';drillView();return;}
  D.s=make(s,m);D.last=[m.f,m.t];D.i++;ANIM=[m.f,m.t];D.msg='<div class="fb good">'+t('fbOk')+'</div>';D.hint=null;drillView();drillAuto();
}
// ---------- boot
window.onerror=function(msg){var e=$('err');if(e){e.style.display='block';e.textContent=(UI.lang==='en'?'Error: ':'خطأ: ')+msg;}};
applyUI();
home();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script></body></html>
